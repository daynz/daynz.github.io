br>    <span class="hljs-keyword">return</span> ans;<br>&#125;<br></code></pre></td></tr></table></figure> <h3 id="有两个输入-两个都需要遍历完">有两个输入, 两个都需要遍历完</h3> <figure class="highlight c++"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br></pre></td><td class="code"><pre><code class="hljs c++"><span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">fn</span><span class="hljs-params">(vector&lt;<span class="hljs-type">int</span>&gt;&amp; arr1, vector&lt;<span class="hljs-type">int</span>&gt;&amp; arr2)</span> </span>&#123;<br>    <span class="hljs-type">int</span> i = <span class="hljs-number">0</span>, j = <span class="hljs-number">0</span>, ans = <span class="hljs-number">0</span>;<br>    <span class="hljs-keyword">while</span> (i &lt; arr<span class="hljs-number">1.</span><span class="hljs-built_in">size</span>() &amp;&amp; j &lt; arr<span class="hljs-number">2.</span><span class="hljs-built_in">size</span>()) &#123;<br>        <span class="hljs-comment">// 根据题意补充代码</span><br>        <span class="hljs-keyword">if</span> (CONDITION) &#123;<br>            i++;<br>        &#125; <span class="hljs-keyword">else</span> &#123;<br>            j++;<br>        &#125;<br>    &#125;<br>    <span class="hljs-keyword">while</span> (i &lt; arr<span class="hljs-number">1.</span><span class="hljs-built_in">size</span>()) &#123;<br>        <span class="hljs-comment">// 根据题意补充代码</span><br>        i++;<br>    &#125;<br>    <span class="hljs-keyword">while</span> (j &lt; arr<span class="hljs-number">2.</span><span class="hljs-built_in">size</span>()) &#123;<br>        <span class="hljs-comment">// 根据题意补充代码</span><br>        j++;<br>    &#125;<br>    <span class="hljs-keyword">return</span> ans;<br>&#125;<br></code></pre></td></tr></table></figure> <h3 id="链表">链表</h3> <figure class="highlight c++"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br></pre></td><td class="code"><pre><code class="hljs c++"><span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">fn</span><span class="hljs-params">(ListNode* head)</span> </span>&#123;<br>    ListNode* slow = head;<br>    ListNode* fast = head;<br>    <span class="hljs-type">int</span> ans = <span class="hljs-number">0</span>;<br>    <span class="hljs-keyword">while</span> (fast != <span class="hljs-literal">nullptr</span> &amp;&amp; fast-&gt;next != <span class="hljs-literal">nullptr</span>) &#123;<br>        <span class="hljs-comment">// 根据题意补充代码</span><br>        slow = slow-&gt;next;<br>        fast = fast-&gt;next-&gt;next;<br>    &#125;<br>    <span class="hljs-keyword">return</span> ans;<br>&#125;<br></code></pre></td></tr></table></figure> <h2 id="滑动窗口">滑动窗口</h2> <figure class="highlight c++"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br></pre></td><td class="code"><pre><code class="hljs c++"><span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">fn</span><span class="hljs-params">(vector&lt;<span class="hljs-type">int</span>&gt;&amp; arr)</span> </span>&#123;<br>    <span class="hljs-type">int</span> left = <span class="hljs-number">0</span>, ans = <span class="hljs-number">0</span>, curr = <span class="hljs-number">0</span>;<br>    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> right = <span class="hljs-number">0</span>; right &lt; arr.<span class="hljs-built_in">size</span>(); right++) &#123;<br>        <span class="hljs-comment">// 根据题意补充代码来将 arr[right] 添加到 curr</span><br>        <span class="hljs-keyword">while</span> (WINDOW_CONDITION_BROKEN) &#123;<br>            <span class="hljs-comment">// 从 curr 中删除 arr[left]</span><br>            left++;<br>        &#125;<br>        <span class="hljs-comment">// 更新 ans</span><br>    &#125;<br>    <span class="hljs-keyword">return</span> ans;<br>&#125;<br></code></pre></td></tr></table></figure> <h2 id="前缀和">前缀和</h2> <figure class="highlight c++"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br></pre></td><td class="code"><pre><code class="hljs c++"><span class="hljs-function">vector&lt;<span class="hljs-type">int</span>&gt; <span class="hljs-title">fn</span><span class="hljs-params">(vector&lt;<span class="hljs-type">int</span>&gt;&amp; arr)</span> </span>&#123;<br>    <span class="hljs-function">vector&lt;<span class="hljs-type">int</span>&gt; <span class="hljs-title">prefix</span><span class="hljs-params">(arr.size())</span></span>;<br>    prefix[<span class="hljs-number">0</span>] = arr[<span class="hljs-number">0</span>];<br>    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">1</span>; i &lt; arr.<span class="hljs-built_in">size</span>(); i++) &#123;<br>        prefix[i] = prefix[i - <span class="hljs-number">1</span>] + arr[i];<br>    &#125;<br>    <span class="hljs-keyword">return</span> prefix;<br>&#125;<br></code></pre></td></tr></table></figure> <h2 id="反转链表">反转链表</h2> <figure class="highlight c++"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br></pre></td><td class="code"><pre><code class="hljs c++"><span class="hljs-function">ListNode* <span class="hljs-title">fn</span><span class="hljs-params">(ListNode* head)</span> </span>&#123;<br>    ListNode* curr = head;<br>    ListNode* prev = <span class="hljs-literal">nullptr</span>;<br>    <span class="hljs-keyword">while</span> (curr != <span class="hljs-literal">nullptr</span>) &#123;<br>        ListNode* nextNode = curr-&gt;next;<br>        curr-&gt;next = prev;<br>        prev = curr;<br>        curr = nextNode;<br>    &#125;<br>    <span class="hljs-keyword">return</span> prev;<br>&#125;<br></code></pre></td></tr></table></figure> <h2 id="单调栈">单调栈</h2> <figure class="highlight c++"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br></pre></td><td class="c ">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br></pre></td><td class="code"><pre><code class="hljs c++"><span class="hljs-comment">// 注意:只有需要在每个节点上存储数据时才需要使用类。</span><br><span class="hljs-comment">// 否则，您可以只使用哈希映射实现一个前缀树。</span><br><span class="hljs-keyword">struct</span> <span class="hljs-title class_">TrieNode</span> &#123;<br>    <span class="hljs-type">int</span> data;<br>    unordered_map&lt;<span class="hljs-type">char</span>, TrieNode*&gt; children;<br>    <span class="hljs-built_in">TrieNode</span>() : <span class="hljs-built_in">data</span>(<span class="hljs-number">0</span>), <span class="hljs-built_in">children</span>(<span class="hljs-built_in">unordered_map</span>&lt;<span class="hljs-type">char</span>, TrieNode*&gt;()) &#123;&#125;<br>&#125;;<br><span class="hljs-function">TrieNode* <span class="hljs-title">buildTrie</span><span class="hljs-params">(vector&lt;string&gt; words)</span> </span>&#123;<br>    TrieNode* root = <span class="hljs-keyword">new</span> <span class="hljs-built_in">TrieNode</span>();<br>    <span class="hljs-keyword">for</span> (string word: words) &#123;<br>        TrieNode* curr = root;<br>        <span class="hljs-keyword">for</span> (<span class="hljs-type">char</span> c: word) &#123;<br>            <span class="hljs-keyword">if</span> (curr-&gt;children.<span class="hljs-built_in">find</span>(c) == curr-&gt;children.<span class="hljs-built_in">end</span>()) &#123;<br>                curr-&gt;children[c] = <span class="hljs-keyword">new</span> <span class="hljs-built_in">TrieNode</span>();<br>            &#125;<br>            curr = curr-&gt;children[c];<br>            <span class="hljs-comment">// 这个位置上的 curr 已经有一个完整的单词</span><br>            <span class="hljs-comment">// 如果你愿意，你可以在这里执行更多的操作来给 curr 添加属性</span><br>        &#125;<br>    &#125;<br>    <span class="hljs-keyword">return</span> root;<br>&#125
