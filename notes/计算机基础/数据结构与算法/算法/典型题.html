<figure class="highlight c++"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br></pre></td><td class="code"><pre><code class="hljs c++"><span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">removeElement</span><span class="hljs-params">(vector&lt;<span class="hljs-type">int</span>&gt;&amp; nums, <span class="hljs-type">int</span> val)</span> </span>&#123;<br>    <span class="hljs-type">int</span> n = nums.<span class="hljs-built_in">size</span>();<br>    <span class="hljs-type">int</span> slow = <span class="hljs-number">0</span>, fast = <span class="hljs-number">0</span>;<br>    <span class="hljs-keyword">while</span> (fast &lt; n) &#123;<br>        <span class="hljs-keyword">if</span> (nums[fast] != val) &#123;<br>            nums[slow] = nums[fast];<br>            ++slow;<br>        &#125;<br>        ++fast;<br>    &#125;<br>    <span class="hljs-keyword">return</span> slow;<br>&#125;<br></code></pre></td></tr></table></figure>

<figure class="highlight c++"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br></pre></td><td class="code"><pre><code class="hljs c++"><span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">removeDuplicates</span><span class="hljs-params">(vector&lt;<span class="hljs-type">int</span>&gt; &amp;nums)</span> </span>&#123;<br>    <span class="hljs-type">int</span> n = nums.<span class="hljs-built_in">size</span>();<br>    <span class="hljs-keyword">if</span> (n == <span class="hljs-number">0</span>)<span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;<br>    <span class="hljs-type">int</span> fast = <span class="hljs-number">1</span>, slow = <span class="hljs-number">1</span>;<br>    <span class="hljs-keyword">while</span> (fast &lt; n) &#123;<br>        <span class="hljs-keyword">if</span> (nums[fast] != nums[fast - <span class="hljs-number">1</span>]) &#123;<br>            nums[slow] = nums[fast];<br>            ++slow;<span class="hljs-comment">// 满足条件慢指针动</span><br>        &#125;<br>        ++fast;<br>    &#125;<br>    <span class="hljs-keyword">return</span> slow;<br>&#125;<br></code></pre></td></tr></table></figure>

<figure class="highlight c++"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br></pre></td><td class="code"><pre><code class="hljs c++"><span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">minSubArrayLen</span><span class="hljs-params">(<span class="hljs-type">int</span> target, vector&lt;<span class="hljs-type">int</span>&gt; &amp;nums)</span> </span>&#123;<br>    <span class="hljs-type">int</span> n = nums.<span class="hljs-built_in">size</span>(); <span class="hljs-keyword">if</span> (n == <span class="hljs-number">0</span>) <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;<br>    <span class="hljs-type">int</span> ans = INT_MAX, sum = <span class="hljs-number">0</span>;<br>    <span class="hljs-type">int</span> left = <span class="hljs-number">0</span>, right = <span class="hljs-number">0</span>;<br>    <span class="hljs-keyword">while</span> (right &lt; n) &#123;<br>        sum += nums[right];<br>        <span class="hljs-keyword">while</span> (sum &gt;= target) &#123;<br>            ans = <span class="hljs-built_in">min</span>(ans, right - left + <span class="hljs-number">1</span>);<br>            sum -= nums[left];<br>            left++;<br>        &#125;<br>        right++;<br>    &#125;<br>    <span class="hljs-keyword">return</span> ans == INT_MAX ? <span class="hljs-number">0</span> : ans;<br>&#125;<br></code></pre></td></tr></table></figure>
<h1 id="树">树</h1>
<h2 id="DFS">DFS</h2>
<h3 id="递归">递归</h3>
<figure class="highlight c++"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br></pre></td><td class="code"><pre><code class="hljs c++"><span class="hljs-comment">// 1. 前序遍历：根 → 左 → 右</span><br><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">preOrder</span><span class="hljs-params">(TreeNode* root, vector&lt;<span class="hljs-type">int</span>&gt;&amp; res)</span> </span>&#123;<br>    <span class="hljs-keyword">if</span> (!root) <span class="hljs-keyword">return</span>; <span class="hljs-comment">// 递归终止条件：节点为空</span><br>    res.<span class="hljs-built_in">push_back</span>(root-&gt;val);  <span class="hljs-comment">// 访问根节点</span><br>    <span class="hljs-built_in">preOrder</span>(root-&gt;left, res); <span class="hljs-comment">// 递归左子树</span><br>    <span class="hljs-built_in">preOrder</span>(root-&gt;right, res);<span class="hljs-comment">// 递归右子树</span><br>&#125;<br><br><span class="hljs-comment">// 2. 中序遍历：左 → 根 → 右</span><br><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">inOrder</span><span class="hljs-params">(TreeNode* root, vector&lt;<span class="hljs-type">int</span>&gt;&amp; res)</span> </span>&#123;<br>    <span class="hljs-keyword">if</span> (!root) <span class="hljs-keyword">return</span>;<br>    <span class="hljs-built_in">inOrder</span>(root-&gt;left, res);<br>    res.<span class="hljs-built_in">push_back</span>(root-&gt;val);<br>    <span class="hljs-built_in">inOrder</span>(root-&gt;right, res);<br>&#125;<br><br><span class="hljs-comment">// 3. 后序遍历：左 → 右 → 根</span><br><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">postOrder</span><span class="hljs-params">(TreeNode* root, vector&lt;<span class="hljs-type">int</span>&gt;&amp; res)</span> </span>&#123;<br>    <span class="hljs-keyword">if</span> (!root) <span class="hljs-keyword">return</span>;<br>    <span class="hljs-built_in">postOrder</span>(root-&gt;left, res);<br>    <span class="hljs-built_in">postOrder</span>(root-&gt;right, res);<br>    res.<span class="hljs-built_in">push_back</span>(root-&gt;val);<br>&#125;<br></code></pre></td></tr></table></figure>

pan><br></pre></td><td class="code"><pre><code class="hljs c++"><span class="hljs-comment">// 非递归前序遍历</span><br><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">preOrderNonRecur</span><span class="hljs-params">(TreeNode* root, vector&lt;<span class="hljs-type">int</span>&gt;&amp; res)</span> </span>&#123;<br>    <span class="hljs-keyword">if</span> (!root) <span class="hljs-keyword">return</span>;<br>    stack&lt;TreeNode*&gt; st;<br>    st.<span class="hljs-built_in">push</span>(root);<br>    <span class="hljs-comment">// 栈：先进后出，所以先压右孩子，再压左孩子</span><br>    <span class="hljs-keyword">while</span> (!st.<span class="hljs-built_in">empty</span>()) &#123;<br>        TreeNode* node = st.<span class="hljs-built_in">top</span>();<br>        st.<span class="hljs-built_in">pop</span>();<br>        res.<span class="hljs-built_in">push_back</span>(node-&gt;val);<br>        <span class="hljs-keyword">if</span> (node-&gt;right) st.<span class="hljs-built_in">push</span>(node-&gt;right);<br>        <span class="hljs-keyword">if</span> (node-&gt;left) st.<span class="hljs-built_in">push</span>(node-&gt;left);<br>    &#125;<br>&#125;<br><br><span class="hljs-comment">// 非递归中序遍历</span><br><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">inOrderNonRecur</span><span class="hljs-params">(TreeNode* root, vector&lt;<span class="hljs-type">int</span>&gt;&amp; res)</span> </span>&#123;<br>    <span class="hljs-keyword">if</span> (!root) <span class="hljs-keyword">return</span>;<br>    stack&lt;TreeNode*&gt; st;<br>    TreeNode* cur = root;<br>    <span class="hljs-keyword">while</span> (cur || !st.<span class="hljs-built_in">empty</span>()) &#123;<br>        <span class="hljs-comment">// 一直向左走，压入所有左节点</span><br>        <span class="hljs-keyword">while</span> (cur) &#123;<br>            st.<span class="hljs-built_in">push</span>(cur);<br>            cur = cur-&gt;left;<br>        &#125;<br>        <span class="hljs-comment">// 取出节点访问</span><br>        cur = st.<span class="hljs-built_in">top</span>();<br>        st.<span class="hljs-built_in">pop</span>();<br>        res.<span class="hljs-built_in">push_back</span>(cur-&gt;val);<br>        <span class="hljs-comment">// 转向右子树</span><br>        cur = cur-&gt;right;<br>    &#125;<br>&#125;<br><br><span class="hljs-comment">// 非递归后序遍历</span><br><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">postOrderNonRecur</span><span class="hljs-params">(TreeNode* root, vector&lt;<span class="hljs-type">int</span>&gt;&amp; res)</span> </span>&#123;<br>    <span class="hljs-keyword">if</span> (!root) <span class="hljs-keyword">return</span>;<br>    stack&lt;TreeNode*&gt; st;<br>    TreeNode* cur = root;<br>    TreeNode* lastVisited = <span class="hljs-literal">nullptr</span>; <span class="hljs-comment">// 记录上一个访问的节点</span><br>    <br>    <span class="hljs-keyword">while</span> (cur || !st.<span class="hljs-built_in">empty</span>()) &#123;<br>        <span class="hljs-comment">// 一直向左</span><br>        <span class="hljs-keyword">while</span> (cur) &#123;<br>            st.<span class="hljs-built_in">push</span>(cur);<br>            cur = cur-&gt;left;<br>        &#125;<br>        <br>        TreeNode* topNode = st.<span class="hljs-built_in">top</span>();<br>        <span class="hljs-comment">// 右子树为空 或 右子树已访问 → 访问当前节点</span><br>        <span class="hljs-keyword">if</span> (!topNode-&gt;right || topNode-&gt;right == lastVisited) &#123;<br>            res.<span class="hljs-built_in">push_back</span>(topNode-&gt;val);<br>            lastVisited = topNode;<br>            st.<span class="hljs-built_in">pop</span>();<br>        &#125; <span class="hljs-keyword">else</span> &#123;<br>            <span class="hljs-comment">// 否则转向右子树</span><br>            cur = topNode-&gt;right;<br>        &#125;<br>    &#125;<br>&#125;<br></code></pre></td></tr></table></figure>
<h2 id="BFS">BFS</h2>
<figure class="highlight c++"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br></pre></td><td class="code"><pre><code class="hljs c++"><span class="hljs-comment">// 1. 基础 BFS：一维数组（按层遍历）</span><br><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">bfs</span><span class="hljs-params">(TreeNode* root, vector&lt;<span class="hljs-type">int</span>&gt;&amp; res)</span> </span>&#123;<br>    <span class="hljs-keyword">if</span> (!root) <span class="hljs-keyword">return</span>;<br>    <br>    queue&lt;TreeNode*&gt; q;  <span class="hljs-comment">// 队列：先进先出</span><br>    q.<span class="hljs-built_in">push</span>(root);        <span class="hljs-comment">// 根节点入队</span><br>    <br>    <span class="hljs-keyword">while</span> (!q.<span class="hljs-built_in">empty</span>()) &#123;<br>        TreeNode* cur = q.<span class="hljs-built_in">front</span>(); <span class="hljs-comment">// 取队首</span><br>        q.<span class="hljs-built_in">pop</span>();                   <span class="hljs-comment">// 出队</span><br>        <br>        res.<span class="hljs-built_in">push_back</span>(cur-&gt;val);   <span class="hljs-comment">// 访问节点</span><br>        <br>        <span class="hljs-keyword">if</span> (cur-&gt;left)  q.<span class="hljs-built_in">push</span>(cur-&gt;left);  <span class="hljs-comment">// 左孩子入队</span><br>        <span class="hljs-keyword">if</span> (cur-&gt;right) q.<span class="hljs-built_in">push</span>(cur-&gt;right); <span class="hljs-comment">// 右孩子入队</span><br>    &#125;<br>&#125;<br><br><span class="hljs-comment">// 2. 分层 BFS：二维数组（每层单独一组）</span><br>vector&lt;vector&lt;<span class="hljs-type">int</span>&gt;&gt; <span class="hljs-built_in">bfsLevel</span>(TreeNode* root) &#123;<br>    vector&lt;vector&lt;<span class="hljs-type">int</span>&gt;&gt; res;<br>    <span class="hljs-keyword">if</span> (!root) <span class="hljs-keyword">return</span> res;<br>    <br>    queue&lt;TreeNode*&gt; q;<br>    q.<span class="hljs-built_in">push</span>(root);<br>    <br>    <span class="hljs-keyword">while</span> (!q.<span class="hljs-built_in">empty</span>()) &#123;<br>        <span class="hljs-type">int</span> levelSize = q.<span class="hljs-built_in">size</span>(); <span class="hljs-comment">// 当前层有多少个节点</span><br>        vector&lt;<span class="hljs-type">int</span>&gt; level;        <span class="hljs-comment">// 存储当前层的结果</span><br>        <br>        <span class="hljs-comment">// 遍历当前层所有节点</span><br>        <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; levelSize; ++i) &#123;<br>            TreeNode* cur = q.<span class="hljs-built_in">front</span>();<br>            q.<span class="hljs-built_in">pop</span>();<br>            <br>            level.<span class="hljs-built_in">push_back</span>(cur-&gt;val);<br>            <br>            <span class="hljs-keyword">if</span> (cur-&gt;left)  q.<span class="hljs-built_in">push</span>(cur-&gt;left);<br>            <span class="hljs-keyword">if</span> (cur-&gt;right) q.<span class="hljs-built_in">push</span>(cur-&gt;right);<br>        &#125;<br>        <br>        res.<span class="hljs-built_in">push_back</span>(level); <span class="hljs-comment">// 把当前层加入结果</span><br>    &#125;<br>    <span class="hljs-keyword">return</span> res;<br>&#125;<br></code></pre></td></tr></table></figure>

        <span class="hljs-keyword">if</span> (!visited[v]) &#123;<br>                visited[v] = <span class="hljs-literal">true</span>;<br>                st.<span class="hljs-built_in">push</span>(v);<br>            &#125;<br>        &#125;<br>    &#125;<br>&#125;<br></code></pre></td></tr></table></figure>

n class="hljs-params">(vector&lt;vector&lt;<span class="hljs-type">char</span>&gt;&gt;&amp; grid)</span> </span>&#123;<br>        <span class="hljs-comment">// 四个方向</span><br>        <br>        <span class="hljs-type">int</span> cnt = <span class="hljs-number">0</span>;<br>        <span class="hljs-type">int</span> m = grid.<span class="hljs-built_in">size</span>();<br>        <span class="hljs-keyword">if</span> (m == <span class="hljs-number">0</span>) <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;<br>        <span class="hljs-type">int</span> n = grid[<span class="hljs-number">0</span>].<span class="hljs-built_in">size</span>();<br><br>        <span class="hljs-comment">// 遍历每个格子</span><br>        <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; m; ++i) &#123;<br>            <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> j = <span class="hljs-number">0</span>; j &lt; n; ++j) &#123;<br>                <span class="hljs-keyword">if</span> (grid[i][j] == <span class="hljs-string">&#x27;1&#x27;</span>) &#123;<br>                    cnt++;<br>                    <span class="hljs-comment">// 调用独立的 DFS 函数</span><br>                    <span class="hljs-built_in">dfs</span>(grid, direction, m, n, i, j);<br>                &#125;<br>            &#125;<br>        &#125;<br>        <span class="hljs-keyword">return</span> cnt;<br>    &#125;<br><br><span class="hljs-keyword">private</span>:<br>    <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">dfs</span><span class="hljs-params">(vector&lt;vector&lt;<span class="hljs-type">char</span>&gt;&gt;&amp; grid, </span></span><br><span class="hljs-params"><span class="hljs-function">             <span class="hljs-type">int</span> m, <span class="hljs-type">int</span> n, </span></span><br><span class="hljs-params"><span class="hljs-function">             <span class="hljs-type">int</span> x, <span class="hljs-type">int</span> y)</span> </span>&#123;<br>        vector&lt;pair&lt;<span class="hljs-type">int</span>, <span class="hljs-type">int</span>&gt;&gt; direction&#123;&#123;<span class="hljs-number">0</span>, <span class="hljs-number">1</span>&#125;, &#123;<span class="hljs-number">1</span>, <span class="hljs-number">0</span>&#125;, &#123;<span class="hljs-number">-1</span>, <span class="hljs-number">0</span>&#125;, &#123;<span class="hljs-number">0</span>, <span class="hljs-number">-1</span>&#125;&#125;;<br>        stack&lt;pair&lt;<span class="hljs-type">int</span>, <span class="hljs-type">int</span>&gt;&gt; st;<br>        st.<span class="hljs-built_in">push</span>(&#123;x, y&#125;);<br>        grid[x][y] = <span class="hljs-string">&#x27;0&#x27;</span>;  <span class="hljs-comment">// 标记已访问</span><br><br>        <span class="hljs-keyword">while</span> (!st.<span class="hljs-built_in">empty</span>()) &#123;<br>            <span class="hljs-keyword">auto</span> [curX, curY] = st.<span class="hljs-built_in">top</span>();<br>            st.<span class="hljs-built_in">pop</span>();<br><br>            <span class="hljs-comment">// 遍历四个方向</span><br>            <span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span>&amp; dir : direction) &#123;<br>                <span class="hljs-type">int</span> dx = dir.first;<br>                <span class="hljs-type">int</span> dy = dir.second;<br>                <span class="hljs-type">int</span> nx = curX + dx;<br>                <span class="hljs-type">int</span> ny = curY + dy;<br><br>                <span class="hljs-keyword">if</span> (nx &gt;= <span class="hljs-number">0</span> &amp;&amp; nx &lt; m &amp;&amp; ny &gt;= <span class="hljs-number">0</span> &amp;&amp; ny &lt; n &amp;&amp; grid[nx][ny] == <span class="hljs-string">&#x27;1&#x27;</span>) &#123;<br>                    grid[nx][ny] = <span class="hljs-string">&#x27;0&#x27;</span>;<br>                    st.<span class="hljs-built_in">push</span>(&#123;nx, ny&#125;);<br>                &#125;<br>            &#125;<br>        &#125;<br>    &#125;<br>&#125;;<br></code></pre></td></tr></table></figure>
<h2 id="BFS-2">BFS</h2>
<figure class="highlight c++"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br></pre></td><td class="code"><pre><code class="hljs c++"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">bfs</span><span class="hljs-params">(<span class="hljs-type">int</span> start, vector&lt;vector&lt;<span class="hljs-type">int</span>&gt;&gt;&amp; adj, vector&lt;<span class="hljs-type">bool</span>&gt;&amp; vis, vector&lt;<span class="hljs-type">int</span>&gt;&amp; res)</span></span><br><span class="hljs-function"></span>&#123;<br>    queue&lt;<span class="hljs-type">int</span>&gt; q;<br>    q.<span class="hljs-built_in">push</span>(start);<br>    vis[start] = <span class="hljs-literal">true</span>;<br><br>    <span class="hljs-keyword">while</span> (!q.<span class="hljs-built_in">empty</span>())<br>    &#123;<br>        <span class="hljs-type">int</span> u = q.<span class="hljs-built_in">front</span>();<br>        q.<span class="hljs-built_in">pop</span>();<br>        res.<span class="hljs-built_in">push_back</span>(u);<br><br>        <span class="hljs-comment">// 遍历所有邻接点</span><br>        <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> v : adj[u])<br>        &#123;<br>            <span class="hljs-keyword">if</span> (!vis[v])<br>            &#123;<br>                vis[v] = <span class="hljs-literal">true</span>;<br>                q.<span class="hljs-built_in">push</span>(v);<br>            &#125;<br>        &#125;<br>    &#125;<br>&#125;<br></code></pre></td></tr></table></figure>
<p><a target="_blank" rel="noopener" href="https://leetcode.cn/problems/nearest-exit-from-entrance-in-maze/">1926. 迷宫中离入口最近的出口</a></p>
<figure class="highlight c++"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br></pre></td><td class="code"><pre><code class="hljs c++"><span class="hljs-function"><span class="hljs-type">int</span> <span class="hljs-title">nearestExit</span><span class="hljs-params">(vector&lt;vector&lt;<span class="hljs-type">char</span>&gt;&gt;&amp; maze, vector&lt;<span class="hljs-type">int</span>&gt;&amp; entrance)</span> </span>&#123;<br>    <span class="hljs-type">int</span> m = maze.<span class="hljs-built_in">size</span>();<br>    <span class="hljs-type">int</span> n = maze[<span class="hljs-number">0</span>].<span class="hljs-built_in">size</span>();<br>    <span class="hljs-type">const</span> <span class="hljs-type">static</span> vector&lt;pair&lt;<span class="hljs-type">int</span>, <span class="hljs-type">int</span>&gt;&gt; DIRS = &#123;&#123;<span class="hljs-number">1</span>, <span class="hljs-number">0</span>&#125;, &#123;<span class="hljs-number">0</span>, <span class="hljs-number">1</span>&#125;, &#123;<span class="hljs-number">-1</span>, <span class="hljs-number">0</span>&#125;, &#123;<span class="hljs-number">0</span>, <span class="hljs-number">-1</span>&#125;&#125;;<br><br>    <span class="hljs-keyword">auto</span> bfs = [&amp;](<span class="hljs-type">int</span> x, <span class="hljs-type">int</span> y) -&gt; <span class="hljs-type">int</span> &#123;<br>        queue&lt;pair&lt;<span class="hljs-type">int</span>, <span class="hljs-type">int</span>&gt;&gt; q;<br>        vector&lt;vector&lt;<span class="hljs-type">bool</span>&gt;&gt; <span class="hljs-built_in">visited</span>(m, <span class="hljs-built_in">vector</span>&lt;<span class="hljs-type">bool</span>&gt;(n, <span class="hljs-literal">false</span>));<br>        q.<span class="hljs-built_in">push</span>(&#123;x, y&#125;);<br>        visited[x][y] = <span class="hljs-literal">true</span>;<br><br>        <span class="hljs-type">int</span> step = <span class="hljs-number">0</span>;<br>        <span class="hljs-keyword">while</span> (!q.<span class="hljs-built_in">empty</span>()) &#123;<br>            <span class="hljs-type">int</span> sz = q.<span class="hljs-built_in">size</span>();<br>            <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; sz; i++) &#123;<br>                <span class="hljs-keyword">auto</span> [curX, curY] = q.<span class="hljs-built_in">front</span>();<br>                q.<span class="hljs-built_in">pop</span>();<br><br>                <span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span> [dx, dy] : DIRS) &#123;<br>                    <span class="hljs-type">int</span> nx = curX + dx;<br>                    <span class="hljs-type">int</span> ny = curY + dy;<br><br>                    <span class="hljs-keyword">if</span> (nx &lt; <span class="hljs-number">0</span> || nx &gt;= m || ny &lt; <span class="hljs-number">0</span> || ny &gt;= n)<br>                        <span class="hljs-keyword">continue</span>;<br>                    <span class="hljs-keyword">if</span> (maze[nx][ny] != <span class="hljs-string">&#x27;.&#x27;</span> || visited[nx][ny])<br>                        <span class="hljs-keyword">continue</span>;<br><br>                    <span class="hljs-keyword">if</span> (nx == <span class="hljs-number">0</span> || nx == m - <span class="hljs-number">1</span> || ny == <span class="hljs-number">0</span> || ny == n - <span class="hljs-number">1</span>) &#123;<br>                        <span class="hljs-keyword">return</span> step + <span class="hljs-number">1</span>;<br>                    &#125;<br><br>                    visited[nx][ny] = <span class="hljs-literal">true</span>;<br>                    q.<span class="hljs-built_in">push</span>(&#123;nx, ny&#125;);<br>                &#125;<br>            &#125;<br>            step++;<br>        &#125;<br>        <span class="hljs-keyword">return</span> <span class="hljs-number">-1</span>;<br>    &#125;;<br><br>    <span class="hljs-keyword">return</span> <span class="hljs-built_in">bfs</span>(entrance[<span class="hljs-number">0</span>], entrance[<span class="hljs-number">1</span>]);<br>&#125;<br></code></pre></td></tr></table></figure>
